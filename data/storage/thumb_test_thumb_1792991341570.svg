<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bgGrad)"/>

  <!-- High-tech Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="2">
    <line x1="0" y1="240" x2="1080" y2="240"/><line x1="0" y1="480" x2="1080" y2="480"/><line x1="0" y1="720" x2="1080" y2="720"/><line x1="0" y1="960" x2="1080" y2="960"/><line x1="0" y1="1200" x2="1080" y2="1200"/><line x1="0" y1="1440" x2="1080" y2="1440"/><line x1="0" y1="1680" x2="1080" y2="1680"/><line x1="0" y1="1920" x2="1080" y2="1920"/>
    <line x1="90" y1="0" x2="90" y2="1920"/><line x1="180" y1="0" x2="180" y2="1920"/><line x1="270" y1="0" x2="270" y2="1920"/><line x1="360" y1="0" x2="360" y2="1920"/><line x1="450" y1="0" x2="450" y2="1920"/><line x1="540" y1="0" x2="540" y2="1920"/><line x1="630" y1="0" x2="630" y2="1920"/><line x1="720" y1="0" x2="720" y2="1920"/><line x1="810" y1="0" x2="810" y2="1920"/><line x1="900" y1="0" x2="900" y2="1920"/><line x1="990" y1="0" x2="990" y2="1920"/><line x1="1080" y1="0" x2="1080" y2="1920"/>
  </g>

  <!-- Dramatic Lighting Glow -->
  <circle cx="810" cy="768" r="432" fill="#ef4444" opacity="0.25" filter="url(#glow)"/>
  <circle cx="216" cy="1536" r="324" fill="#3b82f6" opacity="0.2" filter="url(#glow)"/>

  <!-- Outer Neon Border -->
  <rect x="24" y="24" width="1032" height="1872" rx="24" fill="none" stroke="#ef4444" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Category Badge -->
  <g transform="translate(60, 120)">
    <rect width="320" height="64" rx="12" fill="#3b82f6" opacity="0.95"/>
    <text x="160" y="42" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="26" text-anchor="middle" letter-spacing="2">
      TECHNOLOGY
    </text>
  </g>

  <!-- Headline Text with Massive Impact -->
  <g transform="translate(60, 864)" filter="url(#shadow)">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="86" letter-spacing="1">
      VECTOR
    </text>
    <text x="0" y="105" fill="url(#accentGrad)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="86" letter-spacing="1">
            MAGIC
          </text>
  </g>

  <!-- 4K / HD Quality Badge -->
  <g transform="translate(880, 1780)">
    <rect width="140" height="54" rx="8" fill="#ef4444" opacity="0.9"/>
    <text x="70" y="36" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" text-anchor="middle">
      SHORTS
    </text>
  </g>
</svg>