<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- High-tech Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="2">
    <line x1="0" y1="90" x2="1280" y2="90"/><line x1="0" y1="180" x2="1280" y2="180"/><line x1="0" y1="270" x2="1280" y2="270"/><line x1="0" y1="360" x2="1280" y2="360"/><line x1="0" y1="450" x2="1280" y2="450"/><line x1="0" y1="540" x2="1280" y2="540"/><line x1="0" y1="630" x2="1280" y2="630"/><line x1="0" y1="720" x2="1280" y2="720"/>
    <line x1="106.66666666666667" y1="0" x2="106.66666666666667" y2="720"/><line x1="213.33333333333334" y1="0" x2="213.33333333333334" y2="720"/><line x1="320" y1="0" x2="320" y2="720"/><line x1="426.6666666666667" y1="0" x2="426.6666666666667" y2="720"/><line x1="533.3333333333334" y1="0" x2="533.3333333333334" y2="720"/><line x1="640" y1="0" x2="640" y2="720"/><line x1="746.6666666666667" y1="0" x2="746.6666666666667" y2="720"/><line x1="853.3333333333334" y1="0" x2="853.3333333333334" y2="720"/><line x1="960" y1="0" x2="960" y2="720"/><line x1="1066.6666666666667" y1="0" x2="1066.6666666666667" y2="720"/><line x1="1173.3333333333335" y1="0" x2="1173.3333333333335" y2="720"/><line x1="1280" y1="0" x2="1280" y2="720"/>
  </g>

  <!-- Dramatic Lighting Glow -->
  <circle cx="960" cy="288" r="288" fill="#10b981" opacity="0.25" filter="url(#glow)"/>
  <circle cx="256" cy="576" r="216" fill="#3b82f6" opacity="0.2" filter="url(#glow)"/>

  <!-- Outer Neon Border -->
  <rect x="24" y="24" width="1232" height="672" rx="24" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Category Badge -->
  <g transform="translate(80, 90)">
    <rect width="260" height="52" rx="12" fill="#3b82f6" opacity="0.95"/>
    <text x="130" y="34" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="2">
      CODING TUTORIALS
    </text>
  </g>

  <!-- Headline Text with Massive Impact -->
  <g transform="translate(80, 374.40000000000003)" filter="url(#shadow)">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="74" letter-spacing="1">
      SQLITE
    </text>
    <text x="0" y="90" fill="url(#accentGrad)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="74" letter-spacing="1">
            INTERNALS
          </text>
  </g>

  <!-- 4K / HD Quality Badge -->
  <g transform="translate(1100, 620)">
    <rect width="110" height="44" rx="8" fill="#ef4444" opacity="0.9"/>
    <text x="55" y="29" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="19" text-anchor="middle">
      4K ULTRA
    </text>
  </g>
</svg>