<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe padding for maskable -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle glow ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.4" stroke-dasharray="16 12"/>

  <!-- YouTube Play Screen Hexagon / Shield -->
  <rect x="136" y="160" width="240" height="192" rx="44" fill="url(#accent)" filter="url(#glow)"/>

  <!-- Play button symbol -->
  <path d="M232 206 L308 256 L232 306 Z" fill="#ffffff"/>

  <!-- Autopilot sparkles / automation gears -->
  <path d="M370 120 L378 142 L400 150 L378 158 L370 180 L362 158 L340 150 L362 142 Z" fill="#38bdf8"/>
  <path d="M120 340 L126 355 L140 360 L126 365 L120 380 L114 365 L100 360 L114 355 Z" fill="#a855f7"/>

  <!-- Fast-forward arrows on top to signify speed/autopilot -->
  <path d="M210 115 L235 130 L210 145 Z" fill="#38bdf8" opacity="0.8"/>
  <path d="M245 115 L270 130 L245 145 Z" fill="#38bdf8" opacity="0.8"/>
</svg>
